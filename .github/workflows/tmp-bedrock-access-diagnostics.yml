name: TEMP Bedrock Access Diagnostics

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for diagnostics
        required: false
        default: us-east-1
      stack_name:
        description: Backend CloudFormation stack name
        required: false
        default: AskUSDA-Backend
      lambda_name:
        description: WebSocket Lambda function name
        required: false
        default: AskUSDA-WebSocketHandler

permissions:
  id-token: write
  contents: read

jobs:
  diagnose-bedrock-access:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION }}
      STACK_NAME: ${{ inputs.stack_name }}
      LAMBDA_NAME: ${{ inputs.lambda_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run diagnostics
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "== Caller identity =="
          aws sts get-caller-identity --output json | tee diagnostics/sts-identity.json

          ACCOUNT_ID="$(jq -r '.Account' diagnostics/sts-identity.json)"
          REGION="${AWS_REGION}"

          echo
          echo "== Resolve Lambda config =="
          if aws lambda get-function-configuration --function-name "${LAMBDA_NAME}" --region "${REGION}" --output json > diagnostics/lambda-config.json 2> diagnostics/lambda-config.err; then
            echo "Using Lambda function name: ${LAMBDA_NAME}"
          else
            echo "Lambda by name not found, trying stack resource lookup from ${STACK_NAME}..."
            PHYSICAL_ID="$(aws cloudformation describe-stack-resource --stack-name "${STACK_NAME}" --logical-resource-id WebSocketHandler --region "${REGION}" --query 'StackResourceDetail.PhysicalResourceId' --output text 2>/dev/null || true)"
            if [[ -z "${PHYSICAL_ID}" || "${PHYSICAL_ID}" == "None" ]]; then
              echo "Unable to resolve Lambda. See diagnostics/lambda-config.err"
              exit 1
            fi
            LAMBDA_NAME="${PHYSICAL_ID}"
            aws lambda get-function-configuration --function-name "${LAMBDA_NAME}" --region "${REGION}" --output json > diagnostics/lambda-config.json
            echo "Resolved Lambda from stack: ${LAMBDA_NAME}"
          fi

          ROLE_ARN="$(jq -r '.Role' diagnostics/lambda-config.json)"
          ROLE_NAME="${ROLE_ARN##*/}"
          echo "Lambda Role ARN: ${ROLE_ARN}"
          echo "Lambda Role Name: ${ROLE_NAME}"

          echo
          echo "== Lambda environment (selected keys) =="
          jq -r '.Environment.Variables | {
            BEDROCK_MODEL_ID,
            KNOWLEDGE_BASE_ID,
            AWS_ACCOUNT_ID,
            AWS_REGION,
            CRAWLER_REGION,
            GUARDRAIL_ID,
            GUARDRAIL_VERSION
          }' diagnostics/lambda-config.json | tee diagnostics/lambda-env-selected.json

          echo
          echo "== IAM role policies =="
          aws iam list-attached-role-policies --role-name "${ROLE_NAME}" --output json > diagnostics/iam-attached-policies.json
          aws iam list-role-policies --role-name "${ROLE_NAME}" --output json > diagnostics/iam-inline-policy-names.json

          jq -r '.AttachedPolicies[]?.PolicyArn' diagnostics/iam-attached-policies.json | while read -r policy_arn; do
            [[ -n "${policy_arn}" ]] || continue
            policy_name="${policy_arn##*/}"
            version_id="$(aws iam get-policy --policy-arn "${policy_arn}" --query 'Policy.DefaultVersionId' --output text)"
            aws iam get-policy-version --policy-arn "${policy_arn}" --version-id "${version_id}" --output json \
              > "diagnostics/iam-attached-${policy_name}.json"
          done

          jq -r '.PolicyNames[]?' diagnostics/iam-inline-policy-names.json | while read -r policy_name; do
            [[ -n "${policy_name}" ]] || continue
            aws iam get-role-policy --role-name "${ROLE_NAME}" --policy-name "${policy_name}" --output json \
              > "diagnostics/iam-inline-${policy_name}.json"
          done

          echo
          echo "== Bedrock-related statements in role docs =="
          grep -RinE 'bedrock:|nova|inference-profile|InvokeModel|ApplyGuardrail|Retrieve' diagnostics/iam-*.json || true

          echo
          echo "== Bedrock profile/model visibility checks =="
          aws bedrock get-inference-profile \
            --inference-profile-identifier us.amazon.nova-pro-v1:0 \
            --region "${REGION}" \
            --output json > diagnostics/bedrock-inference-profile.json || true

          aws bedrock list-foundation-models \
            --region "${REGION}" \
            --query 'modelSummaries[?contains(modelId, `nova`) || contains(modelId, `titan`) || contains(modelId, `rerank`)]' \
            --output json > diagnostics/bedrock-models.json || true

          echo
          echo "== IAM policy simulation (if allowed by caller role) =="
          cat > diagnostics/iam-simulate-resources.json <<EOF
          [
            "arn:aws:bedrock:${REGION}:${ACCOUNT_ID}:inference-profile/us.amazon.nova-pro-v1:0",
            "arn:aws:bedrock:${REGION}::foundation-model/amazon.nova-pro-v1:0",
            "arn:aws:bedrock:${REGION}::foundation-model/amazon.titan-embed-text-v2:0",
            "arn:aws:bedrock:${REGION}::foundation-model/amazon.rerank-v1:0"
          ]
          EOF

          aws iam simulate-principal-policy \
            --policy-source-arn "${ROLE_ARN}" \
            --action-names bedrock:InvokeModel bedrock:InvokeModelWithResponseStream bedrock:GetInferenceProfile bedrock:Retrieve bedrock:ApplyGuardrail \
            --resource-arns $(jq -r '.[]' diagnostics/iam-simulate-resources.json | xargs) \
            --output json > diagnostics/iam-simulate-results.json || true

          echo
          echo "== Recent AccessDenied logs (last 24h) =="
          LOG_GROUP="/aws/lambda/${LAMBDA_NAME}"
          START_MS="$(( ($(date +%s) - 86400 ) * 1000 ))"
          aws logs filter-log-events \
            --log-group-name "${LOG_GROUP}" \
            --start-time "${START_MS}" \
            --filter-pattern '"AccessDenied" || "AccessDeniedException" || "access denied" || "bedrock"' \
            --region "${REGION}" \
            --output json > diagnostics/lambda-accessdenied-logs.json || true

          echo
          echo "== Live websocket chat-path probe =="
          WS_URL="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --region "${REGION}" --query 'Stacks[0].Outputs[?OutputKey==`WebSocketUrl`].OutputValue' --output text 2>/dev/null || true)"
          if [[ -n "${WS_URL}" && "${WS_URL}" != "None" ]]; then
            echo "WebSocket URL: ${WS_URL}" | tee diagnostics/websocket-url.txt
            python -m pip install --quiet websocket-client
            export WS_URL
            export CHAT_SESSION_ID="diag-live-$(date +%s)"
            export CHAT_MESSAGE="What services can AskUSDA help with? Provide two bullet points."

            python - <<'PY' > diagnostics/live-chat-probe.json
import json
import os
import ssl
import sys
import time

import websocket

url = os.environ["WS_URL"]
session_id = os.environ["CHAT_SESSION_ID"]
message = os.environ["CHAT_MESSAGE"]

frames = []
result = {
    "sessionId": session_id,
    "websocketUrl": url,
    "message": message,
    "finalText": None,
    "error": None,
    "frames": frames,
}

try:
    ws = websocket.create_connection(url, timeout=60, sslopt={"cert_reqs": ssl.CERT_REQUIRED})
    ws.settimeout(60)
    ws.send(json.dumps({"action": "sendMessage", "message": message, "sessionId": session_id}))
    stream_text = ""
    started = time.time()

    while time.time() - started < 90:
      raw = ws.recv()
      frames.append(raw)
      try:
        data = json.loads(raw)
      except Exception:
        continue

      msg_type = data.get("type")
      if msg_type == "stream":
        chunk = data.get("chunk") or ""
        stream_text += chunk
        if data.get("isComplete") and stream_text:
          result["finalText"] = stream_text
          break
      elif msg_type == "message":
        result["finalText"] = data.get("message")
        break
      elif msg_type == "error":
        result["error"] = data.get("message") or raw
        break

    ws.close()
except Exception as exc:
    result["error"] = str(exc)

print(json.dumps(result, indent=2))
PY

            echo "Chat session id: ${CHAT_SESSION_ID}" | tee diagnostics/live-chat-session-id.txt
            CHAT_START_MS="$(( ($(date +%s) - 1800 ) * 1000 ))"
            aws logs filter-log-events \
              --log-group-name "${LOG_GROUP}" \
              --start-time "${CHAT_START_MS}" \
              --region "${REGION}" \
              --output json > diagnostics/lambda-logs-last30m.json || true

            jq --arg sid "${CHAT_SESSION_ID}" '.events | map(select((.message // "") | contains($sid)))' diagnostics/lambda-logs-last30m.json > diagnostics/lambda-logs-live-session.json || true
            jq '[.[] | select((.message // "") | test("AccessDenied|AccessDeniedException|not authorized|bedrock|model|inference"; "i"))]' diagnostics/lambda-logs-live-session.json > diagnostics/lambda-logs-live-session-auth-errors.json || true
          else
            echo "WebSocketUrl output not found; skipping live chat probe" | tee diagnostics/live-chat-probe-skipped.txt
          fi

          echo
          echo "== Summary =="
          echo "Region: ${REGION}"
          echo "Lambda: ${LAMBDA_NAME}"
          echo "Role:   ${ROLE_ARN}"
          echo "Diagnostics written under diagnostics/"

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-access-diagnostics
          path: diagnostics/
          if-no-files-found: error
