name: AskUSDA Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/askusda-smoke.yml"
  workflow_dispatch:
    inputs:
      PROBE_MESSAGE:
        description: 'Custom chat probe message'
        required: false
        default: 'How do I apply for farm loans?'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_APP_NAME: ${{ vars.AMPLIFY_APP_NAME }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      WEBSOCKET_LAMBDA_NAME: ${{ vars.WEBSOCKET_LAMBDA_NAME }}
      PROBE_MESSAGE: ${{ github.event.inputs.PROBE_MESSAGE || 'How do I apply for farm loans?' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Amplify app id
        run: |
          if [ -z "${AMPLIFY_APP_ID}" ]; then
            APP_NAME="${AMPLIFY_APP_NAME:-AskUSDA-Frontend}"
            LOOKUP_APP_ID=$(aws amplify list-apps --region "${AWS_REGION}" --query "apps[?name=='${APP_NAME}'].appId | [0]" --output text)
            if [ -z "${LOOKUP_APP_ID}" ] || [ "${LOOKUP_APP_ID}" = "None" ]; then
              echo "Unable to resolve AMPLIFY_APP_ID for smoke test"
              exit 1
            fi
            echo "AMPLIFY_APP_ID=${LOOKUP_APP_ID}" >> "$GITHUB_ENV"
          fi

      - name: Resolve backend outputs
        id: stack
        run: |
          TARGET_STACK="${STACK_NAME:-AskUSDA-Backend}"
          echo "admin_api_url=$(aws cloudformation describe-stacks --stack-name ${TARGET_STACK} --query 'Stacks[0].Outputs[?OutputKey==`AdminApiUrl`].OutputValue' --output text --region ${AWS_REGION})" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed frontend and public API
        run: |
          ADMIN_API_URL="${{ steps.stack.outputs.admin_api_url }}"
          APP_ID="${AMPLIFY_APP_ID}"
          BRANCH="${DEPLOY_BRANCH:-main}"
          ADMIN_API_BASE="${ADMIN_API_URL%/}"

          curl_http_code() {
            local url="$1"
            shift
            local output
            local curl_exit

            set +e
            output=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "$@" "${url}" 2>&1)
            curl_exit=$?
            set -e

            if [ ${curl_exit} -ne 0 ]; then
              if [ ${curl_exit} -eq 28 ]; then
                echo "TIMEOUT"
              else
                echo "CURL_ERROR:${curl_exit}:${output}"
              fi
              return 1
            fi

            echo "${output}"
          }

          FRONTEND_URL=$(aws amplify get-branch \
            --app-id "${APP_ID}" \
            --branch-name "${BRANCH}" \
            --region "${AWS_REGION}" \
            --query 'branch.webUrl' \
            --output text)

          if [ -z "${FRONTEND_URL}" ] || [ "${FRONTEND_URL}" = "None" ]; then
            FRONTEND_URL="https://${BRANCH}.${APP_ID}.amplifyapp.com"
            echo "Using fallback Amplify URL: ${FRONTEND_URL}"
          fi

          if ! FRONTEND_CODE=$(curl_http_code "${FRONTEND_URL}"); then
            if [ "${FRONTEND_CODE}" = "TIMEOUT" ]; then
              echo "Frontend smoke test failed: network timeout while requesting ${FRONTEND_URL}"
            else
              echo "Frontend smoke test failed: ${FRONTEND_CODE}"
            fi
            exit 1
          fi
          echo "Frontend status code: ${FRONTEND_CODE}"
          if [ "${FRONTEND_CODE}" -lt 200 ] || [ "${FRONTEND_CODE}" -ge 400 ]; then
            echo "Frontend smoke test failed"
            exit 1
          fi

          if ! FEEDBACK_CODE=$(curl_http_code "${ADMIN_API_BASE}/feedback" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"conversationId":"smoke-feedback","feedback":"pos"}'); then
            if [ "${FEEDBACK_CODE}" = "TIMEOUT" ]; then
              echo "Primary feedback endpoint test failed: network timeout on ${ADMIN_API_BASE}/feedback"
            else
              echo "Primary feedback endpoint test failed: ${FEEDBACK_CODE}"
            fi
            exit 1
          fi

          if [ "${FEEDBACK_CODE}" -lt 200 ] || [ "${FEEDBACK_CODE}" -ge 400 ]; then
            if ! FEEDBACK_CODE=$(curl_http_code "${ADMIN_API_BASE}/prod/feedback" \
              -X POST \
              -H "Content-Type: application/json" \
              --data '{"conversationId":"smoke-feedback","feedback":"pos"}'); then
              if [ "${FEEDBACK_CODE}" = "TIMEOUT" ]; then
                echo "POST /prod/feedback fallback status code: TIMEOUT | test: stage-prefixed fallback endpoint connectivity"
              else
                echo "POST /prod/feedback fallback status code: ${FEEDBACK_CODE} | test: stage-prefixed fallback endpoint connectivity"
              fi
              exit 1
            fi
            echo "POST /prod/feedback fallback status code: ${FEEDBACK_CODE} | test: stage-prefixed fallback endpoint returned application response"
          fi

          echo "Feedback smoke status code: ${FEEDBACK_CODE} | test: feedback API reached and returned an HTTP result"
          # Synthetic conversation IDs are expected to return 404 from feedback update.
          if [ "${FEEDBACK_CODE}" = "404" ]; then
            echo "Feedback smoke returned expected 404 for synthetic conversation id | test: backend validation rejects non-existent conversation id"
          elif [ "${FEEDBACK_CODE}" -lt 200 ] || [ "${FEEDBACK_CODE}" -ge 400 ]; then
            echo "Admin API smoke test failed on /feedback"
            exit 1
          fi

          ESCALATION_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"name":"Smoke Test","email":"smoke@example.com","question":"smoke test"}' \
            "${ADMIN_API_BASE}/escalations")

          if [ "${ESCALATION_CODE}" -lt 200 ] || [ "${ESCALATION_CODE}" -ge 400 ]; then
            ESCALATION_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data '{"name":"Smoke Test","email":"smoke@example.com","question":"smoke test"}' \
              "${ADMIN_API_BASE}/prod/escalations")
            echo "POST /prod/escalations fallback status code: ${ESCALATION_CODE}"
          fi

          echo "Escalation smoke status code: ${ESCALATION_CODE}"
          if [ "${ESCALATION_CODE}" -lt 200 ] || [ "${ESCALATION_CODE}" -ge 400 ]; then
            echo "Admin API smoke test failed on /escalations"
            exit 1
          fi

      - name: Smoke test websocket chat path
        run: |
          set -euo pipefail
          mkdir -p smoke-chat-probe

          WS_URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME:-AskUSDA-Backend}" \
            --query 'Stacks[0].Outputs[?OutputKey==`WebSocketUrl`].OutputValue' \
            --output text \
            --region "${AWS_REGION}")

          if [ -z "${WS_URL}" ] || [ "${WS_URL}" = "None" ]; then
            echo "Smoke test websocket chat path failed: unable to resolve WebSocketUrl"
            exit 1
          fi

          python -m pip install --quiet websocket-client

          export WS_URL
          export CHAT_SESSION_ID="smoke-$(date +%s)"
          export CHAT_MESSAGE="$PROBE_MESSAGE"

          python - <<'PY' > smoke-chat-probe/live-chat-probe.json
import json
import os
import ssl
import time

import websocket

url = os.environ["WS_URL"]
session_id = os.environ["CHAT_SESSION_ID"]
message = os.environ["CHAT_MESSAGE"]

frames = []
result = {
    "sessionId": session_id,
    "websocketUrl": url,
    "message": message,
    "finalText": None,
    "error": None,
    "frames": frames,
}

try:
    ws = websocket.create_connection(url, timeout=60, sslopt={"cert_reqs": ssl.CERT_REQUIRED})
    ws.settimeout(60)
    ws.send(json.dumps({"action": "sendMessage", "message": message, "sessionId": session_id}))

    stream_text = ""
    started = time.time()
    while time.time() - started < 90:
        raw = ws.recv()
        frames.append(raw)
        try:
            data = json.loads(raw)
        except Exception:
            continue

        msg_type = data.get("type")
        if msg_type == "stream":
            chunk = data.get("chunk") or ""
            stream_text += chunk
            if data.get("isComplete") and stream_text:
                result["finalText"] = stream_text
                break
        elif msg_type == "message":
            result["finalText"] = data.get("message")
            break
        elif msg_type == "error":
            result["error"] = data.get("message") or raw
            break

    ws.close()
except Exception as exc:
    result["error"] = str(exc)

print(json.dumps(result, indent=2))
PY

          echo "Chat-path probe result:"
          cat smoke-chat-probe/live-chat-probe.json

          if jq -e '.error != null and .error != ""' smoke-chat-probe/live-chat-probe.json >/dev/null 2>&1; then
            echo "Chat-path probe failed: websocket returned an error"
            exit 1
          fi

          if jq -e '.finalText == null or .finalText == ""' smoke-chat-probe/live-chat-probe.json >/dev/null 2>&1; then
            echo "Chat-path probe failed: no final model response was returned"
            exit 1
          fi

          echo "Chat-path probe completed with a model response"
