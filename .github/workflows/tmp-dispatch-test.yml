name: TEMP Chat Live Probe Diagnostics

'on':
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STACK_NAME: AskUSDA-Backend
      LAMBDA_NAME: AskUSDA-WebSocketHandler
      PROBE_MESSAGE: What services can AskUSDA help with? Provide two short bullet points.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run probe script
        shell: bash
        run: bash .github/scripts/tmp_chat_live_probe.sh

      - name: Upload probe diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-live-probe-diagnostics
          path: diagnostics/
          if-no-files-found: error
