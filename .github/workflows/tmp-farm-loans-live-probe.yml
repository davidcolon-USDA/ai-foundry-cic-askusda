name: TEMP Farm Loans Live Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-farm-loans-live-probe.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run live websocket probe
        shell: bash
        run: |
          set -euo pipefail
          REGION='${{ vars.AWS_REGION }}'
          STACK='${{ vars.STACK_NAME }}'
          LAMBDA='${{ vars.WEBSOCKET_LAMBDA_NAME }}'
          PROBE_MESSAGE='How do I apply for farm loans?'

          mkdir -p diagnostics

          aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query 'Stacks[0].Outputs' --output json > diagnostics/stack-outputs.json
          WS_URL="$(jq -r '.[] | select(.OutputKey=="WebSocketUrl") | .OutputValue' diagnostics/stack-outputs.json 2>/dev/null || true)"
          if [[ -z "$WS_URL" || "$WS_URL" == "null" ]]; then
            echo "WebSocketUrl output not found"
            exit 1
          fi

          python -m pip install --quiet websocket-client
          export WS_URL
          export CHAT_SESSION_ID="probe-$(date +%s)"
          export CHAT_MESSAGE="$PROBE_MESSAGE"

          python - <<'PY' > diagnostics/live-chat-probe.json
import json
import os
import ssl
import time

import websocket

url = os.environ["WS_URL"]
session_id = os.environ["CHAT_SESSION_ID"]
message = os.environ["CHAT_MESSAGE"]

frames = []
result = {
    "sessionId": session_id,
    "websocketUrl": url,
    "message": message,
    "finalText": None,
    "error": None,
    "frames": frames,
}

try:
    ws = websocket.create_connection(url, timeout=60, sslopt={"cert_reqs": ssl.CERT_REQUIRED})
    ws.settimeout(60)
    ws.send(json.dumps({"action": "sendMessage", "message": message, "sessionId": session_id}))

    stream_text = ""
    started = time.time()
    while time.time() - started < 90:
        raw = ws.recv()
        frames.append(raw)
        try:
            data = json.loads(raw)
        except Exception:
            continue

        msg_type = data.get("type")
        if msg_type == "stream":
            chunk = data.get("chunk") or ""
            stream_text += chunk
            if data.get("isComplete") and stream_text:
                result["finalText"] = stream_text
                break
        elif msg_type == "message":
            result["finalText"] = data.get("message")
            break
        elif msg_type == "error":
            result["error"] = data.get("message") or raw
            break

    ws.close()
except Exception as exc:
    result["error"] = str(exc)

print(json.dumps(result, indent=2))
PY

          echo '--- Live chat probe result ---'
          jq '{sessionId, message, finalText, error}' diagnostics/live-chat-probe.json

          echo "$CHAT_SESSION_ID" > diagnostics/live-chat-session-id.txt

          START_MS="$(( ($(date +%s) - 1800) * 1000 ))"
          aws logs filter-log-events --log-group-name "/aws/lambda/$LAMBDA" --start-time "$START_MS" --region "$REGION" --output json > diagnostics/lambda-logs-last30m.json || true
          CHAT_SESSION_ID="$(cat diagnostics/live-chat-session-id.txt)"
          jq --arg sid "$CHAT_SESSION_ID" '.events | map(select((.message // "") | contains($sid)))' diagnostics/lambda-logs-last30m.json > diagnostics/lambda-logs-live-session.json || true
          jq '[.[] | select((.message // "") | test("AccessDenied|AccessDeniedException|not authorized|bedrock|model|inference"; "i"))]' diagnostics/lambda-logs-live-session.json > diagnostics/lambda-logs-live-session-auth-errors.json || true
          echo '--- Live session error lines ---'
          jq -r '.[]?.message // empty' diagnostics/lambda-logs-live-session-auth-errors.json || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-loans-live-probe-diagnostics
          path: diagnostics/
          if-no-files-found: error
