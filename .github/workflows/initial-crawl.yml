name: Initial Crawl

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Crawler action to invoke"
        required: true
        default: "crawl_batch"
        type: choice
        options:
          - crawl_batch
          - crawl
          - prepare
          - ingest
      job_filter:
        description: "Optional comma-separated list of job names to crawl (crawl_batch only)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Print the payload and skip invocation"
        required: true
        default: false
        type: boolean
      wait_for_completion:
        description: "For crawl actions, wait for ECS tasks to finish and fail on task errors"
        required: true
        default: true
        type: boolean
      poll_interval_seconds:
        description: "ECS polling interval in seconds"
        required: true
        default: "30"
        type: string
      poll_timeout_minutes:
        description: "Maximum minutes to wait for ECS tasks"
        required: true
        default: "240"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  run-initial-crawl:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      CRAWLER_BUCKET_NAME: ${{ vars.CRAWLER_BUCKET_NAME }}
      CRAWLER_BUCKET: ${{ vars.CRAWLER_BUCKET_NAME }}
      AWS_ACCOUNT_ID: ${{ vars.CDK_DEFAULT_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build crawl payload
        id: payload
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          action = os.environ.get("INPUT_ACTION", "crawl_batch")
          job_filter = [j.strip() for j in os.environ.get("INPUT_JOB_FILTER", "").split(",") if j.strip()]
          dry_run = os.environ.get("INPUT_DRY_RUN", "false").lower() == "true"

          urls_path = Path("CIC-AskUSDA-main/backend/crawler/urls.yaml")
          data = yaml.safe_load(urls_path.read_text(encoding="utf-8")) or {}
          jobs = list(data.get("crawl_jobs", []))

          if job_filter:
            jobs = [job for job in jobs if job.get("name") in job_filter]

          if action == "crawl_batch":
            payload = {"action": "crawl_batch", "jobs": jobs}
          elif action == "crawl":
            if not jobs:
              raise SystemExit("No jobs selected. Provide job_filter when using crawl action.")
            first = jobs[0]
            payload = {
                "action": "crawl",
                "url": first["source_url"],
                "maxPages": str(first.get("max_pages", 99999)),
                "scopeType": first.get("scope_type", "path"),
                "jobId": first.get("name", ""),
            }
          elif action == "prepare":
            payload = {"action": "prepare"}
          elif action == "ingest":
            payload = {"action": "ingest"}
          else:
            raise SystemExit(f"Unsupported action: {action}")

          print(json.dumps({
              "action": action,
              "dry_run": dry_run,
              "job_count": len(jobs),
              "payload": payload,
          }, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"payload<<EOF\n{json.dumps(payload)}\nEOF\n")
              fh.write(f"job_count={len(jobs)}\n")
              fh.write(f"dry_run={'true' if dry_run else 'false'}\n")
          PY
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_JOB_FILTER: ${{ inputs.job_filter }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}

      - name: Show payload summary
        run: |
          echo "Selected jobs: ${{ steps.payload.outputs.job_count }}"
          echo "Dry run: ${{ steps.payload.outputs.dry_run }}"
          echo "Payload: ${{ steps.payload.outputs.payload }}"

      - name: Invoke KBSyncHandler
        if: ${{ steps.payload.outputs.dry_run != 'true' }}
        run: |
          aws lambda invoke \
            --function-name AskUSDA-KBSyncHandler \
            --payload '${{ steps.payload.outputs.payload }}' \
            --cli-binary-format raw-in-base64-out \
            --region "${AWS_REGION}" \
            response.json
          echo "Invocation response:"
          cat response.json

      - name: Poll ECS crawler tasks
        if: ${{ steps.payload.outputs.dry_run != 'true' && inputs.wait_for_completion && (inputs.action == 'crawl_batch' || inputs.action == 'crawl') }}
        env:
          CRAWLER_CLUSTER_NAME: askusda-crawler-cluster
          POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
          POLL_TIMEOUT_MINUTES: ${{ inputs.poll_timeout_minutes }}
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time


          def normalize_payload(raw):
            if isinstance(raw, str):
              return json.loads(raw)
            if isinstance(raw, dict) and isinstance(raw.get("body"), str):
              try:
                body = json.loads(raw["body"])
                merged = dict(raw)
                merged.update(body)
                return merged
              except json.JSONDecodeError:
                return raw
            return raw


          def run_aws(cmd):
            completed = subprocess.run(cmd, capture_output=True, text=True)
            if completed.returncode != 0:
              print("AWS CLI command failed:", " ".join(cmd))
              print(completed.stderr.strip())
              sys.exit(completed.returncode)
            return completed.stdout


          with open("response.json", "r", encoding="utf-8") as fh:
            payload = normalize_payload(json.load(fh))

          task_arns = []

          # crawl_batch response shape
          for item in payload.get("tasks", []):
            arn = item.get("taskArn")
            if arn and arn != "unknown":
              task_arns.append(arn)

          # crawl response shape
          if not task_arns:
            arn = payload.get("taskArn")
            if arn and arn != "unknown":
              task_arns.append(arn)

          failed_launches = [
            item for item in payload.get("tasks", [])
            if item.get("error") or item.get("taskArn") in (None, "", "unknown")
          ]
          if failed_launches:
            print("One or more crawler tasks failed to launch:")
            print(json.dumps(failed_launches, indent=2))
            sys.exit(1)

          if not task_arns:
            print("No ECS task ARNs returned by KBSyncHandler; failing workflow.")
            print(json.dumps(payload, indent=2))
            sys.exit(1)

          cluster = os.environ.get("CRAWLER_CLUSTER_NAME", "askusda-crawler-cluster")
          region = os.environ.get("AWS_REGION", "us-east-1")
          poll_interval = max(5, int(os.environ.get("POLL_INTERVAL_SECONDS", "30")))
          timeout_seconds = max(60, int(os.environ.get("POLL_TIMEOUT_MINUTES", "240")) * 60)
          deadline = time.time() + timeout_seconds

          print(f"Tracking {len(task_arns)} crawler task(s) in cluster {cluster}")
          print(f"Poll interval: {poll_interval}s; timeout: {timeout_seconds // 60}m")

          latest_tasks = []
          while time.time() < deadline:
            stdout = run_aws([
              "aws", "ecs", "describe-tasks",
              "--region", region,
              "--cluster", cluster,
              "--tasks", *task_arns,
              "--output", "json",
            ])
            latest_tasks = json.loads(stdout).get("tasks", [])
            running = [t for t in latest_tasks if t.get("lastStatus") != "STOPPED"]
            print(f"Task progress: {len(latest_tasks) - len(running)}/{len(latest_tasks)} stopped")

            if not running:
              break
            time.sleep(poll_interval)
          else:
            print("Timed out waiting for crawler tasks to stop.")
            print(json.dumps(latest_tasks, indent=2))
            sys.exit(1)

          failures = []
          for task in latest_tasks:
            task_failures = []
            for container in task.get("containers", []):
              exit_code = container.get("exitCode")
              if exit_code not in (None, 0):
                task_failures.append({
                  "container": container.get("name"),
                  "exitCode": exit_code,
                  "reason": container.get("reason", ""),
                })

            if task_failures:
              failures.append({
                "taskArn": task.get("taskArn"),
                "stoppedReason": task.get("stoppedReason", ""),
                "containers": task_failures,
              })

          if failures:
            print("Crawler task failures detected:")
            print(json.dumps(failures, indent=2))
            sys.exit(1)

          print("All tracked crawler tasks completed successfully.")
          PY

      - name: Dry-run complete
        if: ${{ steps.payload.outputs.dry_run == 'true' }}
        run: echo "Dry run requested; no Lambda invocation performed."
