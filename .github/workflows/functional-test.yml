name: Functional Test

on:
  workflow_run:
    workflows:
      - "Deploy Infrastructure"
      - "Deploy Application"
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  functional-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_APP_NAME: ${{ vars.AMPLIFY_APP_NAME }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      PROBE_MESSAGE: "How do I apply for farm loans?"
      EXTRA_PROBE_MESSAGE: "What USDA programs support beginning farmers?"

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve Amplify app id
        run: |
          if [ -z "${AMPLIFY_APP_ID}" ]; then
            APP_NAME="${AMPLIFY_APP_NAME:-AskUSDA-Frontend}"
            LOOKUP_APP_ID=$(aws amplify list-apps --region "${AWS_REGION}" --query "apps[?name=='${APP_NAME}'].appId | [0]" --output text)
            if [ -z "${LOOKUP_APP_ID}" ] || [ "${LOOKUP_APP_ID}" = "None" ]; then
              echo "Unable to resolve AMPLIFY_APP_ID for functional test"
              exit 1
            fi
            echo "AMPLIFY_APP_ID=${LOOKUP_APP_ID}" >> "$GITHUB_ENV"
          fi

      - name: Resolve backend outputs
        id: stack
        run: |
          TARGET_STACK="${STACK_NAME:-AskUSDA-Backend}"
          echo "websocket_url=$(aws cloudformation describe-stacks --stack-name ${TARGET_STACK} --query 'Stacks[0].Outputs[?OutputKey==`WebSocketUrl`].OutputValue' --output text --region ${AWS_REGION})" >> "$GITHUB_OUTPUT"

      - name: Functional test deployed frontend with chat probes
        run: |
          APP_ID="${AMPLIFY_APP_ID}"
          BRANCH="${DEPLOY_BRANCH:-main}"
          FRONTEND_URL=$(aws amplify get-branch \
            --app-id "${APP_ID}" \
            --branch-name "${BRANCH}" \
            --region "${AWS_REGION}" \
            --query 'branch.webUrl' \
            --output text)

          if [ -z "${FRONTEND_URL}" ] || [ "${FRONTEND_URL}" = "None" ]; then
            FRONTEND_URL="https://${BRANCH}.${APP_ID}.amplifyapp.com"
            echo "Using fallback Amplify URL: ${FRONTEND_URL}"
          fi

          echo "Frontend URL: ${FRONTEND_URL}"
          curl -fsS --connect-timeout 10 --max-time 20 "${FRONTEND_URL}" >/dev/null

          python -m pip install --quiet websocket-client

          export WS_URL="${{ steps.stack.outputs.websocket_url }}"
          if [ -z "${WS_URL}" ] || [ "${WS_URL}" = "None" ]; then
            echo "Unable to resolve WebSocketUrl for functional test"
            exit 1
          fi

          probe_chat() {
            local probe_label="$1"
            local probe_message="$2"

            export CHAT_SESSION_ID="functional-${probe_label}-$(date +%s)"
            export CHAT_MESSAGE="${probe_message}"

            echo "Probe (${probe_label}) question: ${probe_message}"
            python - <<'PY'
          import json
          import os
          import ssl
          import time

          import websocket

          url = os.environ["WS_URL"]
          session_id = os.environ["CHAT_SESSION_ID"]
          message = os.environ["CHAT_MESSAGE"]

          frames = []
          result = {
            "sessionId": session_id,
            "websocketUrl": url,
            "message": message,
            "finalText": None,
            "error": None,
            "frames": frames,
          }

          try:
            ws = websocket.create_connection(url, timeout=60, sslopt={"cert_reqs": ssl.CERT_REQUIRED})
            ws.settimeout(60)
            ws.send(json.dumps({"action": "sendMessage", "message": message, "sessionId": session_id}))

            stream_text = ""
            started = time.time()
            while time.time() - started < 90:
              raw = ws.recv()
              frames.append(raw)
              try:
                data = json.loads(raw)
              except Exception:
                continue

              msg_type = data.get("type")
              if msg_type == "stream":
                chunk = data.get("chunk") or ""
                stream_text += chunk
                if data.get("isComplete") and stream_text:
                  result["finalText"] = stream_text
                  break
              elif msg_type == "message":
                result["finalText"] = data.get("message")
                break
              elif msg_type == "error":
                result["error"] = data.get("message") or raw
                break

            ws.close()
          except Exception as exc:
            result["error"] = str(exc)

          print(json.dumps(result, indent=2))

          if result["error"]:
            raise SystemExit(result["error"])

          if not result["finalText"]:
            raise SystemExit("No final model response was returned")

          print("FINAL_LLM_RESPONSE:")
          print(result["finalText"])
          PY
          }

          probe_chat "primary" "${PROBE_MESSAGE}"
          probe_chat "secondary" "${EXTRA_PROBE_MESSAGE}"
