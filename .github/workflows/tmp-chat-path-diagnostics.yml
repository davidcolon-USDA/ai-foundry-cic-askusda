name: TEMP Chat Path Diagnostics

'on':
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: false
        default: us-east-1
      stack_name:
        description: Backend stack name
        required: false
        default: AskUSDA-Backend
      lambda_name:
        description: WebSocket Lambda name
        required: false
        default: AskUSDA-WebSocketHandler
      deploy_branch:
        description: Amplify branch
        required: false
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Collect diagnostics
        shell: bash
        run: |
          set -euo pipefail
          REGION='${{ github.event.inputs.aws_region }}'
          STACK='${{ github.event.inputs.stack_name }}'
          LAMBDA='${{ github.event.inputs.lambda_name }}'
          BRANCH='${{ github.event.inputs.deploy_branch }}'
          APP_ID='${{ vars.AMPLIFY_APP_ID }}'

          mkdir -p diagnostics
          aws sts get-caller-identity --output json > diagnostics/sts-identity.json
          aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query 'Stacks[0].Outputs' --output json > diagnostics/stack-outputs.json
          aws lambda get-function-configuration --function-name "$LAMBDA" --region "$REGION" --output json > diagnostics/lambda-config.json

          echo '--- Step 1: IAM Policy Check ---'
          aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --output json > diagnostics/stack.json
          jq -r '.Stacks[0].Outputs[]?.OutputValue // empty' diagnostics/stack.json | grep -E 'arn:aws:iam::[0-9]+:role/' | sort -u > diagnostics/stack-role-arns.txt || true
          while IFS= read -r role_arn; do
            role_name="${role_arn##*/}"
            echo "Checking role: $role_name"
            aws iam get-role --role-name "$role_name" --output json > "diagnostics/role-${role_name}.json" || true
            aws iam list-attached-role-policies --role-name "$role_name" --output json > "diagnostics/role-${role_name}-attached-policies.json" || true
            aws iam list-role-policies --role-name "$role_name" --output json > "diagnostics/role-${role_name}-inline-policies.json" || true

            for policy_arn in $(jq -r '.AttachedPolicies[]?.PolicyArn // empty' "diagnostics/role-${role_name}-attached-policies.json" 2>/dev/null || true); do
              safe_name="${policy_arn##*/}"
              aws iam get-policy --policy-arn "$policy_arn" --output json > "diagnostics/policy-${role_name}-${safe_name}.json" || true
              ver_id="$(jq -r '.Policy.DefaultVersionId // empty' "diagnostics/policy-${role_name}-${safe_name}.json" 2>/dev/null || true)"
              if [[ -n "$ver_id" ]]; then
                aws iam get-policy-version --policy-arn "$policy_arn" --version-id "$ver_id" --output json > "diagnostics/policy-${role_name}-${safe_name}-version.json" || true
                echo "--- Policy $policy_arn Statements ---"
                jq '.PolicyVersion.Document.Statement' "diagnostics/policy-${role_name}-${safe_name}-version.json" || true
              fi
            done

            for inline_policy in $(jq -r '.PolicyNames[]? // empty' "diagnostics/role-${role_name}-inline-policies.json" 2>/dev/null || true); do
              echo "--- Inline Policy: $inline_policy ($role_name) ---"
              aws iam get-role-policy --role-name "$role_name" --policy-name "$inline_policy" --output json > "diagnostics/role-${role_name}-inline-${inline_policy}.json" || true
              jq '.PolicyDocument.Statement' "diagnostics/role-${role_name}-inline-${inline_policy}.json" || true
            done
          done < diagnostics/stack-role-arns.txt

          echo '--- Step 2: CDK Deploy Status ---'
          aws cloudformation describe-stack-events --stack-name "$STACK" --region "$REGION" --output json > diagnostics/stack-events.json || true
          jq '.StackEvents[] | select((.ResourceStatus // "") | test("FAILED|ROLLBACK"))' diagnostics/stack-events.json > diagnostics/stack-failures.json || true

          echo '--- Step 3: Lambda Role Attachment ---'
          jq '.Role' diagnostics/lambda-config.json
          LAMBDA_ROLE="$(jq -r '.Role // empty' diagnostics/lambda-config.json | awk -F'/' '{print $NF}')"
          aws iam list-attached-role-policies --role-name "$LAMBDA_ROLE" --output json > diagnostics/lambda-role-attached-policies.json || true
          aws iam list-role-policies --role-name "$LAMBDA_ROLE" --output json > diagnostics/lambda-role-inline-policies.json || true
          : > diagnostics/lambda-policy-summary.txt
          for policy_arn in $(jq -r '.AttachedPolicies[]?.PolicyArn // empty' diagnostics/lambda-role-attached-policies.json 2>/dev/null || true); do
            safe_name="${policy_arn##*/}"
            echo "AttachedPolicyArn=$policy_arn" | tee -a diagnostics/lambda-policy-summary.txt
            aws iam get-policy --policy-arn "$policy_arn" --output json > "diagnostics/lambda-policy-${safe_name}.json" || true
            ver_id="$(jq -r '.Policy.DefaultVersionId // empty' "diagnostics/lambda-policy-${safe_name}.json" 2>/dev/null || true)"
            if [[ -n "$ver_id" ]]; then
              aws iam get-policy-version --policy-arn "$policy_arn" --version-id "$ver_id" --output json > "diagnostics/lambda-policy-${safe_name}-version.json" || true
              jq '.PolicyVersion.Document.Statement' "diagnostics/lambda-policy-${safe_name}-version.json" > "diagnostics/lambda-policy-${safe_name}-statements.json" || true
              if jq -e '.PolicyVersion.Document.Statement | tostring | contains("bedrock:Rerank")' "diagnostics/lambda-policy-${safe_name}-version.json" >/dev/null 2>&1; then
                echo "bedrock:Rerank found in $policy_arn" | tee -a diagnostics/lambda-policy-summary.txt
              else
                echo "bedrock:Rerank NOT found in $policy_arn" | tee -a diagnostics/lambda-policy-summary.txt
              fi
            fi
          done

          for inline_policy in $(jq -r '.PolicyNames[]? // empty' diagnostics/lambda-role-inline-policies.json 2>/dev/null || true); do
            echo "InlinePolicyName=$inline_policy" | tee -a diagnostics/lambda-policy-summary.txt
            aws iam get-role-policy --role-name "$LAMBDA_ROLE" --policy-name "$inline_policy" --output json > "diagnostics/lambda-inline-policy-${inline_policy}.json" || true
            jq '.PolicyDocument.Statement' "diagnostics/lambda-inline-policy-${inline_policy}.json" > "diagnostics/lambda-inline-policy-${inline_policy}-statements.json" || true
            if jq -e '.PolicyDocument.Statement | tostring | contains("bedrock:Rerank")' "diagnostics/lambda-inline-policy-${inline_policy}.json" >/dev/null 2>&1; then
              echo "bedrock:Rerank found in inline policy $inline_policy" | tee -a diagnostics/lambda-policy-summary.txt
            else
              echo "bedrock:Rerank NOT found in inline policy $inline_policy" | tee -a diagnostics/lambda-policy-summary.txt
            fi
          done

          printf '%s' '{"requestContext":{"routeKey":"sendMessage","connectionId":"diag-connection"},"body":"{\"action\":\"sendMessage\",\"message\":\"diagnostics probe\",\"sessionId\":\"diag\"}"}' > diagnostics/invoke-event.json
          aws lambda invoke --function-name "$LAMBDA" --region "$REGION" --payload fileb://diagnostics/invoke-event.json --cli-binary-format raw-in-base64-out --log-type Tail diagnostics/lambda-invoke-response.json --output json > diagnostics/lambda-invoke-meta.json || true
          jq -r '.LogResult // empty' diagnostics/lambda-invoke-meta.json | base64 -d > diagnostics/lambda-invoke-tail.log || true

          echo '--- Step 4: Live WebSocket Chat Probe ---'
          WS_URL="$(jq -r '.[] | select(.OutputKey=="WebSocketUrl") | .OutputValue' diagnostics/stack-outputs.json 2>/dev/null || true)"
          if [[ -n "$WS_URL" && "$WS_URL" != "null" ]]; then
            python -m pip install --quiet websocket-client
            export WS_URL
            export CHAT_SESSION_ID="diag-live-$(date +%s)"
            export CHAT_MESSAGE="What services can AskUSDA help with? Provide two bullet points."

            python - <<'PY' > diagnostics/live-chat-probe.json
import json
import os
import ssl
import time

import websocket

url = os.environ["WS_URL"]
session_id = os.environ["CHAT_SESSION_ID"]
message = os.environ["CHAT_MESSAGE"]

frames = []
result = {
    "sessionId": session_id,
    "websocketUrl": url,
    "message": message,
    "finalText": None,
    "error": None,
    "frames": frames,
}

try:
    ws = websocket.create_connection(url, timeout=60, sslopt={"cert_reqs": ssl.CERT_REQUIRED})
    ws.settimeout(60)
    ws.send(json.dumps({"action": "sendMessage", "message": message, "sessionId": session_id}))
    stream_text = ""
    started = time.time()

    while time.time() - started < 90:
        raw = ws.recv()
        frames.append(raw)
        try:
            data = json.loads(raw)
        except Exception:
            continue

        msg_type = data.get("type")
        if msg_type == "stream":
            chunk = data.get("chunk") or ""
            stream_text += chunk
            if data.get("isComplete") and stream_text:
                result["finalText"] = stream_text
                break
        elif msg_type == "message":
            result["finalText"] = data.get("message")
            break
        elif msg_type == "error":
            result["error"] = data.get("message") or raw
            break

    ws.close()
except Exception as exc:
    result["error"] = str(exc)

print(json.dumps(result, indent=2))
PY

            echo "$CHAT_SESSION_ID" > diagnostics/live-chat-session-id.txt
          else
            echo "WebSocketUrl missing from stack outputs" > diagnostics/live-chat-probe-skipped.txt
          fi

          START_MS="$(( ($(date +%s) - 10800) * 1000 ))"
          aws logs filter-log-events --log-group-name "/aws/lambda/$LAMBDA" --start-time "$START_MS" --region "$REGION" --output json > diagnostics/lambda-logs-last3h.json || true

          if [[ -f diagnostics/live-chat-session-id.txt ]]; then
            CHAT_SESSION_ID="$(cat diagnostics/live-chat-session-id.txt)"
            jq --arg sid "$CHAT_SESSION_ID" '.events | map(select((.message // "") | contains($sid)))' diagnostics/lambda-logs-last3h.json > diagnostics/lambda-logs-live-session.json || true
            jq '[.[] | select((.message // "") | test("AccessDenied|AccessDeniedException|not authorized|bedrock|model|inference"; "i"))]' diagnostics/lambda-logs-live-session.json > diagnostics/lambda-logs-live-session-auth-errors.json || true
          fi

          if [[ -n "$APP_ID" ]]; then
            aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH" --region "$REGION" --output json > diagnostics/amplify-branch.json || true
            WEB_URL="$(jq -r '.branch.webUrl // empty' diagnostics/amplify-branch.json 2>/dev/null || true)"
            if [[ -n "$WEB_URL" ]]; then
              curl -sS "$WEB_URL" > diagnostics/frontend-index.html || true
              grep -Eo 'wss://[^" ]+|https://[^" ]+execute-api\.[^" ]+' diagnostics/frontend-index.html | sort -u > diagnostics/frontend-endpoints.txt || true
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-path-diagnostics
          path: diagnostics/
          if-no-files-found: error
